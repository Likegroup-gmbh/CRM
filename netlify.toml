# Netlify Build Configuration

[build]
  command = "npm run build"
  publish = "dist"

# Branch-Deploy v2: Vite backt VITE_* zur Build-Zeit ein.
# Greift nur, wenn Branch v2 in der Netlify-UI als Branch-Deploy aktiv ist.
# Chromium-Functions (strategie-item-background, transcribe-background,
# creator-scrape, site-extract-background) laufen mit — der fruehere Skip
# hat sie auf v2 mit 404 beantwortet.
[context.v2]
  command = "npm run build"
[context.v2.environment]
  VITE_APP_CHANNEL = "v2"

# Netlify Functions Configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # WICHTIG: @sparticuz/chromium ist absichtlich NICHT external: esbuild bundlet
  # nur das JS-Geruest, das 63-MB-Binary laedt browser-setup.js zur Laufzeit aus
  # dem Release-Tarball nach (CHROMIUM_PACK_URL). Als external wuerde das Binary
  # in jeden Function-Zip kopiert und der Deploy-Upload haengt.
  # sharp: native Binaries, kann esbuild nicht bundlen (instagram-connect)
  # typescript: cosmiconfig (über puppeteer-extra) optional-requires es — ohne
  # external fällt esbuild auf den nft-Fallback, Chromium-Zips werden fett/langsam.
  external_node_modules = ["sharp", "typescript"]

# Strategie-Items: Screenshot + Transkription in einem Chromium-Lauf.
# Background Function (Suffix -background): 15 Min Limit, antwortet sofort 202;
# Fortschritt und Ergebnis laufen ueber strategie_items (Realtime).
# puppeteer-extra bleibt external: esbuild macht aus lazy-cache ein
# require('kind-of'), das im Lambda fehlt (502 beim Laden).
[functions."strategie-item-background"]
  external_node_modules = ["typescript","puppeteer-core", "puppeteer-extra", "puppeteer-extra-plugin", "puppeteer-extra-plugin-stealth", "puppeteer-extra-plugin-user-preferences", "puppeteer-extra-plugin-user-data-dir", "merge-deep", "clone-deep", "shallow-clone", "kind-of", "lazy-cache", "for-own", "for-in", "is-plain-object", "isobject", "is-buffer", "is-extendable", "mixin-object", "arr-union", "debug", "ms", "deepmerge", "fs-extra", "rimraf"]
  included_files = ["node_modules/puppeteer-core/**", "node_modules/puppeteer-extra/**", "node_modules/puppeteer-extra-plugin/**", "node_modules/puppeteer-extra-plugin-stealth/**", "node_modules/puppeteer-extra-plugin-user-preferences/**", "node_modules/puppeteer-extra-plugin-user-data-dir/**", "node_modules/merge-deep/**", "node_modules/clone-deep/**", "node_modules/shallow-clone/**", "node_modules/kind-of/**", "node_modules/lazy-cache/**", "node_modules/for-own/**", "node_modules/for-in/**", "node_modules/is-plain-object/**", "node_modules/isobject/**", "node_modules/is-buffer/**", "node_modules/is-extendable/**", "node_modules/mixin-object/**", "node_modules/arr-union/**", "node_modules/debug/**", "node_modules/ms/**", "node_modules/deepmerge/**", "node_modules/fs-extra/**", "node_modules/rimraf/**"]

[functions."creator-scrape"]
  external_node_modules = ["typescript","puppeteer-core", "puppeteer-extra", "puppeteer-extra-plugin", "puppeteer-extra-plugin-stealth", "puppeteer-extra-plugin-user-preferences", "puppeteer-extra-plugin-user-data-dir", "merge-deep", "clone-deep", "shallow-clone", "kind-of", "lazy-cache", "for-own", "for-in", "is-plain-object", "isobject", "is-buffer", "is-extendable", "mixin-object", "arr-union", "debug", "ms", "deepmerge", "fs-extra", "rimraf"]
  included_files = ["node_modules/puppeteer-core/**", "node_modules/puppeteer-extra/**", "node_modules/puppeteer-extra-plugin/**", "node_modules/puppeteer-extra-plugin-stealth/**", "node_modules/puppeteer-extra-plugin-user-preferences/**", "node_modules/puppeteer-extra-plugin-user-data-dir/**", "node_modules/merge-deep/**", "node_modules/clone-deep/**", "node_modules/shallow-clone/**", "node_modules/kind-of/**", "node_modules/lazy-cache/**", "node_modules/for-own/**", "node_modules/for-in/**", "node_modules/is-plain-object/**", "node_modules/isobject/**", "node_modules/is-buffer/**", "node_modules/is-extendable/**", "node_modules/mixin-object/**", "node_modules/arr-union/**", "node_modules/debug/**", "node_modules/ms/**", "node_modules/deepmerge/**", "node_modules/fs-extra/**", "node_modules/rimraf/**"]

# Kundenadaption neu schreiben: ein Claude-Call, kein Scrapen.
[functions."kundenadaption"]
  timeout = 60

# Beschreibung neu analysieren: ein Llama-Call auf gespeichertem Transkript, kein Scrapen.
[functions."beschreibung-analyse"]
  timeout = 60

# Dropbox Upload Function – Videos können groß sein
[functions."dropbox-upload"]
  timeout = 300

# Dropbox Proxy – chunked upload + shared links
[functions."dropbox-proxy"]
  timeout = 300

# Video-Transkription der Testseite /transcribe und des Skript-Generators
# (Background Function: automatisch 15 Min Timeout, antwortet sofort 202)
[functions."transcribe-background"]
  external_node_modules = ["typescript","puppeteer-core", "puppeteer-extra", "puppeteer-extra-plugin", "puppeteer-extra-plugin-stealth", "puppeteer-extra-plugin-user-preferences", "puppeteer-extra-plugin-user-data-dir", "merge-deep", "clone-deep", "shallow-clone", "kind-of", "lazy-cache", "for-own", "for-in", "is-plain-object", "isobject", "is-buffer", "is-extendable", "mixin-object", "arr-union", "debug", "ms", "deepmerge", "fs-extra", "rimraf"]
  included_files = ["node_modules/puppeteer-core/**", "node_modules/puppeteer-extra/**", "node_modules/puppeteer-extra-plugin/**", "node_modules/puppeteer-extra-plugin-stealth/**", "node_modules/puppeteer-extra-plugin-user-preferences/**", "node_modules/puppeteer-extra-plugin-user-data-dir/**", "node_modules/merge-deep/**", "node_modules/clone-deep/**", "node_modules/shallow-clone/**", "node_modules/kind-of/**", "node_modules/lazy-cache/**", "node_modules/for-own/**", "node_modules/for-in/**", "node_modules/is-plain-object/**", "node_modules/isobject/**", "node_modules/is-buffer/**", "node_modules/is-extendable/**", "node_modules/mixin-object/**", "node_modules/arr-union/**", "node_modules/debug/**", "node_modules/ms/**", "node_modules/deepmerge/**", "node_modules/fs-extra/**", "node_modules/rimraf/**"]

# Rueckfragen vor der Skript-Generierung: Leitfaden-Markdown mit ausliefern
[functions."skript-fragen-background"]
  included_files = ["netlify/functions/_shared/prompts/**"]

# Visual-Regie: Stil-Dokument (Produktionsformat) mit ausliefern
[functions."skript-edit-background"]
  included_files = ["netlify/functions/_shared/prompts/**"]

# Instagram Connect: Graph-Call + bis zu 6 Bild-Downloads/WebP-Konvertierungen
[functions."instagram-connect"]
  timeout = 26

# Geschlecht-Backfill: mehrere Claude-Batches nacheinander (25 Creator je Call)
[functions."backfill-geschlecht"]
  timeout = 120

# Webseiten-Extraktion: fetch, im Fallback Chromium, dazu Claude-Aufruf
# und Logo-Konvertierung via sharp.
# Background Function (Suffix -background): 15 Min Limit, antwortet sofort 202;
# Fortschritt und Ergebnis laufen ueber die Tabelle extract_jobs.
# Mehr Speicher, weil Chromium zusammen mit sharp die Standard-1024 MB reisst
# (fuehrte frueher zu 502ern).
[functions."site-extract-background"]
  # memory = 2048 entfernt: Custom Memory erfordert Pro-Plan mit Credit-Preisen,
  # sonst schlaegt der ganze Deploy fehl. Default ist 1024 MB.
  external_node_modules = ["sharp", "typescript", "puppeteer-core", "puppeteer-extra", "puppeteer-extra-plugin", "puppeteer-extra-plugin-stealth", "puppeteer-extra-plugin-user-preferences", "puppeteer-extra-plugin-user-data-dir", "merge-deep", "clone-deep", "shallow-clone", "kind-of", "lazy-cache", "for-own", "for-in", "is-plain-object", "isobject", "is-buffer", "is-extendable", "mixin-object", "arr-union", "debug", "ms", "deepmerge", "fs-extra", "rimraf"]
  included_files = ["node_modules/puppeteer-core/**", "node_modules/puppeteer-extra/**", "node_modules/puppeteer-extra-plugin/**", "node_modules/puppeteer-extra-plugin-stealth/**", "node_modules/puppeteer-extra-plugin-user-preferences/**", "node_modules/puppeteer-extra-plugin-user-data-dir/**", "node_modules/merge-deep/**", "node_modules/clone-deep/**", "node_modules/shallow-clone/**", "node_modules/kind-of/**", "node_modules/lazy-cache/**", "node_modules/for-own/**", "node_modules/for-in/**", "node_modules/is-plain-object/**", "node_modules/isobject/**", "node_modules/is-buffer/**", "node_modules/is-extendable/**", "node_modules/mixin-object/**", "node_modules/arr-union/**", "node_modules/debug/**", "node_modules/ms/**", "node_modules/deepmerge/**", "node_modules/fs-extra/**", "node_modules/rimraf/**"]

# Raeumt taeglich die Temp-Produktbilder, die die KI-Extraktion angelegt hat,
# die aber in keinem Produkt gelandet sind
[functions."cleanup-temp-produktbilder"]
  schedule = "@daily"

# Creator-Upload: Dropbox save_url + Finalisieren (keine grossen Bytes durch
# die Function, aber Dropbox-/DB-Roundtrips)
[functions."creator-upload-complete"]
  timeout = 26

[functions."creator-upload-status"]
  timeout = 26

# Orphan-GC: haengengebliebene Staging-Uploads taeglich aufraeumen
[functions."creator-upload-cleanup"]
  schedule = "@daily"

# Vertrag-Status: Gesendet ohne Unterschrift nach 30 Tagen → Verzögert
[functions."vertrag-status-verzoegert"]
  schedule = "@daily"

# Auth-Seiten direkt ausliefern (NICHT auf index.html umleiten)
[[redirects]]
  from = "/src/auth/*"
  to = "/src/auth/:splat"
  status = 200

# Oeffentliche Creator-Upload-Seite direkt ausliefern (kein SPA-Fallback)
[[redirects]]
  from = "/src/upload/*"
  to = "/src/upload/:splat"
  status = 200

# SPA-Fallback für alle anderen Routen
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Anti-Indexierung: Suchmaschinen dürfen nichts cachen/listen
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Creator-Upload-Seite: Token steckt im URL-Hash — kein Referer-Leak,
# kein Cachen der Seite
[[headers]]
  for = "/src/upload/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

