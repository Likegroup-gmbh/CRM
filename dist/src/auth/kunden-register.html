<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunden Registrierung | CRM</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script type="module" crossorigin src="/assets/kundenRegister-DUkSUUBR.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/fonts-BsohutUs.js">
  <link rel="modulepreload" crossorigin href="/assets/config-DuKnp__J.js">
  <link rel="modulepreload" crossorigin href="/assets/core-RtgtRPof.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-CqHzVmic.js">
  <link rel="stylesheet" crossorigin href="/assets/fonts-BOa7Q1VF.css">
  <link rel="stylesheet" crossorigin href="/assets/buttons-DTrQiGiZ.css">
  <link rel="stylesheet" crossorigin href="/assets/components-CKmmxSB_.css">
  <link rel="stylesheet" crossorigin href="/assets/icons-B3MT8Jt5.css">
</head>
<body style="margin: 0; padding: 0;">
  
  <div class="login-split-container">
    <div class="login-left">
      <div class="login-box">
        <div class="login-logo-wrapper">
          <img src="/assets/background/Logo-Icon-gray.svg" alt="Logo" class="login-logo">
        </div>
        <h2>Kunden-Registrierung</h2>

        <div id="msg" class="text-error" style="display: none;"></div>

        <form id="register-form">
          <div class="form-box">
            <label class="label" for="name">Name</label>
            <input id="name" class="input" type="text" placeholder="Max Mustermann" required />
          </div>
          <div class="form-box">
            <label class="label" for="email">E-Mail</label>
            <input id="email" class="input" type="email" placeholder="kunde@example.com" required />
          </div>
          <div class="form-box">
            <label class="label" for="geburtsdatum">Geburtsdatum *</label>
            <div id="geburtsdatum-host"></div>
          </div>
          <div class="form-box">
            <label class="label" for="password">Passwort</label>
            <div class="password-input-container">
              <input id="password" class="input" type="password" placeholder="••••••••" minlength="8" required />
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Passwort anzeigen">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" aria-hidden="true"></svg>
              </button>
            </div>
          </div>
          <div class="form-box">
            <button id="btn-submit" type="submit" class="mdc-btn">Konto erstellen</button>
          </div>
          <p class="login-consent">
            Mit der Registrierung akzeptierst du unsere
            <a href="https://likegroup.de/agb" target="_blank" rel="noopener noreferrer">AGB</a> und
            <a href="https://likegroup.de/datenschutz" target="_blank" rel="noopener noreferrer">Datenschutzerklärung</a>.
            <br>
            <a href="https://likegroup.de/impressum" target="_blank" rel="noopener noreferrer">Impressum</a>
          </p>
          <div class="login-divider">
            <span>Login</span>
          </div>
          <div class="register-links-row">
            <a href="/" class="register-link-btn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
              </svg>
              Zurück zum Login
            </a>
          </div>
        </form>
      </div>
    </div>
    <div class="login-right"></div>
  </div>

</body>
</html>
