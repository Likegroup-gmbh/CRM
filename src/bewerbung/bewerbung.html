<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bewerbung</title>
  <link rel="stylesheet" href="/assets/styles/components.css">
  <link rel="stylesheet" href="/assets/styles/forms.css">
  <style>
    body { margin: 0; background: var(--bg-secondary, #f6f6f6); color: var(--text-primary, #111); }
    .bewerbung-page { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    .bewerbung-page h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .bewerbung-meta { color: var(--text-secondary, #555); margin-bottom: 24px; }
    .bewerbung-section { background: var(--bg-primary, #fff); border: 1px solid var(--border-primary, #e5e5e5); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .bewerbung-section h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .bewerbung-zeile { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .bewerbung-liste { list-style: none; padding: 0; margin: 0; }
    .bewerbung-liste li { padding: 8px 0; border-bottom: 1px solid var(--border-primary, #eee); }
    .bewerbung-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="bewerbung-page" id="bewerbung-root">
    <p>Link wird geladen …</p>
  </main>
  <script type="module" src="./bewerbung.js"></script>
</body>
</html>
