# Neuigkeiten-Pipeline: nach jedem Push auf main einen Kurz-Post
# ("Was ist neu") fuer die Dashboard-Cards schreiben.
#
# Secrets: ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY

name: Neuigkeiten

on:
  push:
    branches: [main]

permissions:
  contents: read

# Schnelle Folge-Pushes laufen seriell, nicht parallel: sonst racen die
# Laeufe auf den DB-Insert.
concurrency:
  group: neuigkeiten-main
  cancel-in-progress: false

jobs:
  neuigkeit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # volle History, sonst ist github.event.before nicht im Checkout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Neuigkeit erzeugen
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/neuigkeiten/run.cjs
